<text x="1145" y="515" class="body" text-anchor="start"><tspan x="1145" dy="0">① IndexFlatIP</tspan><tspan x="1145" dy="23">→ exact vector index</tspan><tspan x="1145" dy="23"></tspan><tspan x="1145" dy="23">② NetworkX pickle</tspan><tspan x="1145" dy="23">→ persistent graph store</tspan><tspan x="1145" dy="23"></tspan><tspan x="1145" dy="23">③ direct API calls</tspan><tspan x="1145" dy="23">→ cache + batch queue</tspan></text>
