<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Document ingestion and section-aware chunking</title>
<desc id="desc">Pipeline from source documents to 954 content-addressed chunks using 450-word windows and 60-word overlap.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476172"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6B9A"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17324D" flood-opacity="0.12"/></filter>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17324D; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #587083; }
    .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #2F6B9A; }
    .box-title { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; }
    .small { font-size: 13px; fill: #587083; }
    .tiny { font-size: 12px; fill: #587083; }
    .metric { font-size: 16px; font-weight: 700; fill: #2A706B; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; }
  </style>
</defs>
<rect width="1400" height="850" fill="#FFFFFF"/>
<text x="60" y="52" class="title">Document ingestion and section-aware chunking</text>
<text x="60" y="78" class="subtitle">Single frozen chunk manifest feeds every retriever, preventing corpus drift between systems</text>
<line x1="60" y1="96" x2="1340" y2="96" stroke="#D6E0E7" stroke-width="2"/>
<text x="135" y="132" class="stage" text-anchor="middle"><tspan x="135" dy="0">SOURCE</tspan></text>
<text x="480" y="132" class="stage" text-anchor="middle"><tspan x="480" dy="0">NORMALISE</tspan></text>
<text x="840" y="132" class="stage" text-anchor="middle"><tspan x="840" dy="0">SEGMENT</tspan></text>
<text x="1215" y="132" class="stage" text-anchor="middle"><tspan x="1215" dy="0">FREEZE</tspan></text>
<rect x="60" y="165" width="210" height="145" rx="12" fill="#EAF2F8" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="60" y="165" width="7" height="145" rx="3" fill="#2F6B9A"/>
<text x="165.0" y="196" class="box-title" text-anchor="middle"><tspan x="165.0" dy="0">130 policy documents</tspan></text>
<text x="165.0" y="222" class="small" text-anchor="middle"><tspan x="165.0" dy="0">PDF / HTML extracts</tspan><tspan x="165.0" dy="19">title · ministry · source</tspan><tspan x="165.0" dy="19">cleaned_text</tspan></text>
<rect x="345" y="165" width="270" height="145" rx="12" fill="#F4F7FA" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<text x="480.0" y="196" class="box-title" text-anchor="middle"><tspan x="480.0" dy="0">Text + metadata processing</tspan></text>
<text x="480.0" y="222" class="small" text-anchor="middle"><tspan x="480.0" dy="0">whitespace normalisation</tspan><tspan x="480.0" dy="19">document metadata retained</tspan><tspan x="480.0" dy="19">heading candidates detected</tspan></text>
<rect x="690" y="165" width="300" height="145" rx="12" fill="#EDF6F4" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="690" y="165" width="7" height="145" rx="3" fill="#2A8C82"/>
<text x="840.0" y="196" class="box-title" text-anchor="middle"><tspan x="840.0" dy="0">Section-aware windowing</tspan></text>
<text x="840.0" y="222" class="small" text-anchor="middle"><tspan x="840.0" dy="0">target: 450 words</tspan><tspan x="840.0" dy="19">overlap: 60 words</tspan><tspan x="840.0" dy="19">title + active heading prepended</tspan></text>
<rect x="1065" y="165" width="270" height="145" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1065" y="165" width="7" height="145" rx="3" fill="#D99B2B"/>
<text x="1200.0" y="196" class="box-title" text-anchor="middle"><tspan x="1200.0" dy="0">Frozen chunk manifest</tspan></text>
<text x="1200.0" y="222" class="small" text-anchor="middle"><tspan x="1200.0" dy="0">chunks_section_aware_450w.jsonl</tspan><tspan x="1200.0" dy="19">954 stable r4chunk_* IDs</tspan><tspan x="1200.0" dy="19">ordered manifest + SHA-256</tspan></text>
<path d="M 270 238 L 345 238" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M 615 238 L 690 238" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M 990 238 L 1065 238" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="90" y="390" width="1220" height="260" rx="18" fill="#FBFCFD" stroke="#D6E0E7" stroke-width="1.5"/>
<text x="120" y="425" class="stage" text-anchor="start"><tspan x="120" dy="0">OVERLAPPING WINDOW CONSTRUCTION</tspan></text>
<text x="125" y="470" class="small" text-anchor="start"><tspan x="125" dy="0">Document title</tspan><tspan x="125" dy="21">Section A heading</tspan><tspan x="125" dy="21">body words …</tspan></text>
<line x1="330" y1="485" x2="1240" y2="485" stroke="#AFC0CC" stroke-width="8" stroke-linecap="round"/>
<rect x="350" y="450" width="560" height="72" rx="10" fill="#DCEAF4" stroke="#2F6B9A" stroke-width="1.5"/>
<text x="630" y="481" class="body" text-anchor="middle"><tspan x="630" dy="0">Chunk n · words 1–450</tspan><tspan x="630" dy="21">title + current section retained</tspan></text>
<rect x="835" y="535" width="405" height="72" rx="10" fill="#DDEFEA" stroke="#2A8C82" stroke-width="1.5"/>
<text x="1037" y="566" class="body" text-anchor="middle"><tspan x="1037" dy="0">Chunk n+1 · starts at word 391</tspan><tspan x="1037" dy="21">60-word overlap</tspan></text>
<rect x="835" y="450" width="75" height="157" fill="#D99B2B" opacity="0.22"/>
<text x="873" y="630" class="tiny" text-anchor="middle"><tspan x="873" dy="0">shared evidence boundary</tspan></text>
<path d="M 873 617 L 873 598" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="85" y="700" width="380" height="63" rx="9" fill="#FFF9E8" stroke="#D99B2B" stroke-width="1.2"/>
<circle cx="103" cy="720" r="6" fill="#D99B2B"/>
<text x="119" y="721" class="tiny" text-anchor="start"><tspan x="119" dy="0">Same ordered 954-chunk manifest is hashed</tspan><tspan x="119" dy="18">and reused by BM25, FAISS, and Graph v4.</tspan></text>
<rect x="545" y="706" width="220" height="30" rx="15" fill="#E7F2F1"/>
<text x="655.0" y="726" text-anchor="middle" style="font: 700 13px Arial; fill:#2A706B">7.3 chunks / document</text>
<rect x="800" y="706" width="190" height="30" rx="15" fill="#E7F2F1"/>
<text x="895.0" y="726" text-anchor="middle" style="font: 700 13px Arial; fill:#2A706B">no exact duplicates</text>
<rect x="1025" y="706" width="260" height="30" rx="15" fill="#E7F2F1"/>
<text x="1155.0" y="726" text-anchor="middle" style="font: 700 13px Arial; fill:#2A706B">provenance validated at load</text>
</svg>
