<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Evaluation harness and experiment controls</title>
<desc id="desc">Frozen development, locked-test, and holdout paths through retrieval, metrics, paired bootstrap, and immutable run artefacts.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476172"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6B9A"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17324D" flood-opacity="0.12"/></filter>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17324D; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #587083; }
    .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #2F6B9A; }
    .box-title { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; }
    .small { font-size: 13px; fill: #587083; }
    .tiny { font-size: 12px; fill: #587083; }
    .metric { font-size: 16px; font-weight: 700; fill: #2A706B; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; }
  </style>
</defs>
<rect width="1400" height="850" fill="#FFFFFF"/>
<text x="60" y="52" class="title">Evaluation harness and experiment controls</text>
<text x="60" y="78" class="subtitle">Configuration selection remains separated from locked-test and canonical holdout inference</text>
<line x1="60" y1="96" x2="1340" y2="96" stroke="#D6E0E7" stroke-width="2"/>
<rect x="65" y="140" width="260" height="130" rx="12" fill="#EAF2F8" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="65" y="140" width="7" height="130" rx="3" fill="#2F6B9A"/>
<text x="195.0" y="171" class="box-title" text-anchor="middle"><tspan x="195.0" dy="0">Benchmark inputs</tspan></text>
<text x="195.0" y="197" class="small" text-anchor="middle"><tspan x="195.0" dy="0">100 reviewed questions</tspan><tspan x="195.0" dy="19">60 development · 40 locked</tspan><tspan x="195.0" dy="19">140-row qrel crosswalk</tspan><tspan x="195.0" dy="19">954-chunk manifest</tspan></text>
<rect x="65" y="330" width="260" height="120" rx="12" fill="#EDF6F4" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="65" y="330" width="7" height="120" rx="3" fill="#2A8C82"/>
<text x="195.0" y="361" class="box-title" text-anchor="middle"><tspan x="195.0" dy="0">Independent holdout</tspan></text>
<text x="195.0" y="387" class="small" text-anchor="middle"><tspan x="195.0" dy="0">12 post-freeze questions</tspan><tspan x="195.0" dy="19">21 reviewed judgments</tspan><tspan x="195.0" dy="19">two per category</tspan></text>
<rect x="65" y="510" width="260" height="105" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="65" y="510" width="7" height="105" rx="3" fill="#D99B2B"/>
<text x="195.0" y="541" class="box-title" text-anchor="middle"><tspan x="195.0" dy="0">Frozen system configs</tspan></text>
<text x="195.0" y="567" class="small" text-anchor="middle"><tspan x="195.0" dy="0">hash-checked artefacts</tspan><tspan x="195.0" dy="19">one corpus provenance chain</tspan></text>
<polygon points="470,145 590,205 470,265 350,205" fill="#FFF7E5" stroke="#D99B2B" stroke-width="1.7"/>
<text x="470" y="198" class="box-title" text-anchor="middle"><tspan x="470" dy="0">development-only</tspan><tspan x="470" dy="21">selection</tspan></text>
<rect x="385" y="310" width="170" height="88" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="385" y="310" width="7" height="88" rx="3" fill="#D99B2B"/>
<text x="470.0" y="341" class="box-title" text-anchor="middle"><tspan x="470.0" dy="0">Freeze gate</tspan></text>
<text x="470.0" y="367" class="small" text-anchor="middle"><tspan x="470.0" dy="0">configs + query sets</tspan><tspan x="470.0" dy="19">SHA-256 recorded</tspan></text>
<rect x="385" y="470" width="170" height="88" rx="12" fill="#FCEEEE" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="385" y="470" width="7" height="88" rx="3" fill="#B85C5C"/>
<text x="470.0" y="501" class="box-title" text-anchor="middle"><tspan x="470.0" dy="0">Zero-retry gate</tspan></text>
<text x="470.0" y="527" class="small" text-anchor="middle"><tspan x="470.0" dy="0">one attempt/query</tspan><tspan x="470.0" dy="19">failures preserved</tspan></text>
<path d="M 325 205 L 350 205" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 470 265 L 470 310" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 325 390 L 385 354" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 325 562 L 385 514" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="220" width="250" height="200" rx="12" fill="#F4F7FA" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="650" y="220" width="7" height="200" rx="3" fill="#2F6B9A"/>
<text x="775.0" y="251" class="box-title" text-anchor="middle"><tspan x="775.0" dy="0">Query × system runner</tspan></text>
<text x="775.0" y="277" class="small" text-anchor="middle"><tspan x="775.0" dy="0">BM25</tspan><tspan x="775.0" dy="19">FAISS cosine</tspan><tspan x="775.0" dy="19">Entity Graph v4</tspan><tspan x="775.0" dy="19">Weighted Hybrid</tspan><tspan x="775.0" dy="19">Prompt-RAG*</tspan></text>
<path d="M 555 354 L 650 320" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M 555 514 C 600 514, 605 350, 650 350" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="980" y="150" width="285" height="135" rx="12" fill="#EDF6F4" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="980" y="150" width="7" height="135" rx="3" fill="#2A8C82"/>
<text x="1122.5" y="181" class="box-title" text-anchor="middle"><tspan x="1122.5" dy="0">Per-query metrics</tspan></text>
<text x="1122.5" y="207" class="small" text-anchor="middle"><tspan x="1122.5" dy="0">MRR@10 · nDCG@10</tspan><tspan x="1122.5" dy="19">Recall@10 · Precision@k</tspan><tspan x="1122.5" dy="19">Hit@10 · category breakdown</tspan></text>
<rect x="980" y="345" width="285" height="145" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="980" y="345" width="7" height="145" rx="3" fill="#D99B2B"/>
<text x="1122.5" y="376" class="box-title" text-anchor="middle"><tspan x="1122.5" dy="0">Statistical inference</tspan></text>
<text x="1122.5" y="402" class="small" text-anchor="middle"><tspan x="1122.5" dy="0">10,000 paired bootstrap samples</tspan><tspan x="1122.5" dy="19">whole-query resampling · seed 42</tspan><tspan x="1122.5" dy="19">confidence intervals + Holm control</tspan></text>
<rect x="980" y="550" width="285" height="115" rx="12" fill="#EAF2F8" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="980" y="550" width="7" height="115" rx="3" fill="#2F6B9A"/>
<text x="1122.5" y="581" class="box-title" text-anchor="middle"><tspan x="1122.5" dy="0">Immutable run artefacts</tspan></text>
<text x="1122.5" y="607" class="small" text-anchor="middle"><tspan x="1122.5" dy="0">rankings · traces · metrics</tspan><tspan x="1122.5" dy="19">config snapshots · hashes</tspan><tspan x="1122.5" dy="19">failure ledgers</tspan></text>
<path d="M 900 285 L 980 218" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 900 320 L 980 417" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1122 285 L 1122 345" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1122 490 L 1122 550" fill="none" stroke="#476172" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="640" y="500" width="275" height="63" rx="9" fill="#FFF9E8" stroke="#D99B2B" stroke-width="1.2"/>
<circle cx="658" cy="520" r="6" fill="#D99B2B"/>
<text x="674" y="521" class="tiny" text-anchor="start"><tspan x="674" dy="0">* Prompt-RAG: full R4 locked-test result retained.</tspan><tspan x="674" dy="18">Holdout excluded after zero-retry dispatch violation.</tspan></text>
<rect x="385" y="680" width="225" height="30" rx="15" fill="#E7F2F1"/>
<text x="497.5" y="700" text-anchor="middle" style="font: 700 13px Arial; fill:#2A706B">40-query locked test: once</text>
<rect x="635" y="680" width="260" height="30" rx="15" fill="#E7F2F1"/>
<text x="765.0" y="700" text-anchor="middle" style="font: 700 13px Arial; fill:#2A706B">12-query holdout: canonical</text>
<rect x="920" y="680" width="300" height="30" rx="15" fill="#E7F2F1"/>
<text x="1070.0" y="700" text-anchor="middle" style="font: 700 13px Arial; fill:#2A706B">all paired holdout CIs cross zero</text>
<text x="700" y="770" class="small" text-anchor="middle"><tspan x="700" dy="0">Development informs configuration · locked test estimates benchmark performance · holdout determines hypothesis verdicts</tspan></text>
</svg>
