<rect x="120" y="305" width="7" height="92" rx="3" fill="#2F6B9A"/>
<text x="217.5" y="336" class="box-title" text-anchor="middle"><tspan x="217.5" dy="0">BM25</tspan></text>
<text x="217.5" y="362" class="small" text-anchor="middle"><tspan x="217.5" dy="0">rank-bm25</tspan><tspan x="217.5" dy="19">k1 1.2 · b 0.75</tspan></text>
<rect x="345" y="305" width="195" height="92" rx="12" fill="#EEF0FA" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="345" y="305" width="7" height="92" rx="3" fill="#5966A8"/>
<text x="442.5" y="336" class="box-title" text-anchor="middle"><tspan x="442.5" dy="0">FAISS cosine</tspan></text>
<text x="442.5" y="362" class="small" text-anchor="middle"><tspan x="442.5" dy="0">MiniLM · 384 dim</tspan><tspan x="442.5" dy="19">normalised IndexFlatIP</tspan></text>
<rect x="570" y="305" width="195" height="92" rx="12" fill="#EDF6F4" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="570" y="305" width="7" height="92" rx="3" fill="#2A8C82"/>
<text x="667.5" y="336" class="box-title" text-anchor="middle"><tspan x="667.5" dy="0">Entity Graph v4</tspan></text>
<text x="667.5" y="362" class="small" text-anchor="middle"><tspan x="667.5" dy="0">spaCy + NetworkX</tspan><tspan x="667.5" dy="19">2-hop + lexical fallback</tspan></text>
<rect x="795" y="305" width="195" height="92" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="795" y="305" width="7" height="92" rx="3" fill="#D99B2B"/>
<text x="892.5" y="336" class="box-title" text-anchor="middle"><tspan x="892.5" dy="0">Weighted hybrid</tspan></text>
<text x="892.5" y="362" class="small" text-anchor="middle"><tspan x="892.5" dy="0">RRF k=10</tspan><tspan x="892.5" dy="19">weights 1/.25/.10</tspan></text>
<rect x="1020" y="305" width="195" height="92" rx="12" fill="#F6EEF8" stroke="#AFC0CC" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1020" y="305" width="7" height="92" rx="3" fill="#8B5E9C"/>
<text x="1117.5" y="336" class="box-title" text-anchor="middle"><tspan x="1117.5" dy="0">Prompt-RAG</tspan></text>
<text x="1117.5" y="362" class="small" text-anchor="middle"><tspan x="1117.5" dy="0">BM25 25 ∪ FAISS 25</tspan><tspan x="1117.5" dy="19">Claude scores 0–3</tspan></text>
<path d="M 990 245 C 890 245, 317 305, 217 305" fill="none" stroke="#2F6B9A" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="7 6"/>
