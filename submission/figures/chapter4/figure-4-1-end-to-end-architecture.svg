<text x="797.5" y="549" class="small" text-anchor="middle"><tspan x="797.5" dy="0">MRR · nDCG · Recall</tspan><tspan x="797.5" dy="19">Precision · Hit rate</tspan></text>
<rect x="975" y="492" width="215" height="94" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="975" y="492" width="7" height="94" rx="3" fill="#D99B2B"/>
