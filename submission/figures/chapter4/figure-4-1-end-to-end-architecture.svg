<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">End-to-end retrieval evaluation platform</title>
<desc id="desc">Layered architecture from policy documents through retrieval, controlled evaluation, and H5 generation analysis.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#476172"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6B9A"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17324D" flood-opacity="0.12"/></filter>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17324D; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #587083; }
    .stage { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #2F6B9A; }
    .box-title { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; }
    .small { font-size: 13px; fill: #587083; }
    .tiny { font-size: 12px; fill: #587083; }
    .metric { font-size: 16px; font-weight: 700; fill: #2A706B; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; }
  </style>
</defs>
<rect width="1400" height="850" fill="#FFFFFF"/>
<text x="60" y="52" class="title">End-to-end retrieval evaluation platform</text>
<text x="60" y="78" class="subtitle">Implemented R4 architecture; solid arrows are data flow, dashed arrows are control or external-service flow</text>
<line x1="60" y1="96" x2="1340" y2="96" stroke="#D6E0E7" stroke-width="2"/>
<rect x="55" y="120" width="1290" height="125" rx="16" fill="#FBFCFD" stroke="#D6E0E7" stroke-width="1.5"/>
<rect x="55" y="120" width="44" height="125" rx="16" fill="#E8F0F6"/>
<text x="82" y="182.5" class="stage" text-anchor="middle" transform="rotate(-90 82 182.5)">INGESTION</text>
<rect x="125" y="143" width="180" height="76" rx="12" fill="#EAF2F8" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="125" y="143" width="7" height="76" rx="3" fill="#2F6B9A"/>
<text x="215.0" y="174" class="box-title" text-anchor="middle"><tspan x="215.0" dy="0">Policy corpus</tspan></text>
<text x="215.0" y="200" class="small" text-anchor="middle"><tspan x="215.0" dy="0">130 documents</tspan><tspan x="215.0" dy="19">public policy domain</tspan></text>
<rect x="365" y="143" width="190" height="76" rx="12" fill="#F4F7FA" stroke="#AFC0CC" stroke-width="1.5"/>
<text x="460.0" y="174" class="box-title" text-anchor="middle"><tspan x="460.0" dy="0">Normalise</tspan></text>
<text x="460.0" y="200" class="small" text-anchor="middle"><tspan x="460.0" dy="0">clean text + metadata</tspan><tspan x="460.0" dy="19">section detection</tspan></text>
<rect x="615" y="143" width="210" height="76" rx="12" fill="#F4F7FA" stroke="#AFC0CC" stroke-width="1.5"/>
<text x="720.0" y="174" class="box-title" text-anchor="middle"><tspan x="720.0" dy="0">Section-aware chunker</tspan></text>
<text x="720.0" y="200" class="small" text-anchor="middle"><tspan x="720.0" dy="0">450 words · 60 overlap</tspan></text>
<rect x="885" y="143" width="210" height="76" rx="12" fill="#EDF6F4" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="885" y="143" width="7" height="76" rx="3" fill="#2A8C82"/>
