<rect x="120" y="486" width="7" height="106" rx="3" fill="#2F6B9A"/>
<text x="227.5" y="517" class="box-title" text-anchor="middle"><tspan x="227.5" dy="0">Frozen query tiers</tspan></text>
<text x="227.5" y="543" class="small" text-anchor="middle"><tspan x="227.5" dy="0">60 development</tspan><tspan x="227.5" dy="19">40 locked test</tspan><tspan x="227.5" dy="19">12-query holdout</tspan></text>
<rect x="405" y="492" width="215" height="94" rx="12" fill="#F4F7FA" stroke="#AFC0CC" stroke-width="1.5"/>
<text x="512.5" y="523" class="box-title" text-anchor="middle"><tspan x="512.5" dy="0">Experiment runner</tspan></text>
<text x="512.5" y="549" class="small" text-anchor="middle"><tspan x="512.5" dy="0">query × retriever</tspan><tspan x="512.5" dy="19">top-50 ranked outputs</tspan></text>
<rect x="690" y="492" width="215" height="94" rx="12" fill="#EDF6F4" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="690" y="492" width="7" height="94" rx="3" fill="#2A8C82"/>
