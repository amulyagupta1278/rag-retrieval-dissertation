<text x="990.0" y="200" class="small" text-anchor="middle"><tspan x="990.0" dy="0">954 stable chunk IDs</tspan><tspan x="990.0" dy="19">content provenance</tspan></text>
<rect x="1155" y="143" width="130" height="76" rx="12" fill="#FFF7E5" stroke="#AFC0CC" stroke-width="1.5"/>
<rect x="1155" y="143" width="7" height="76" rx="3" fill="#D99B2B"/>
