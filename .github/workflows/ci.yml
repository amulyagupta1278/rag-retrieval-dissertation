name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # These modules verify an owner-local adjudication file that is intentionally
      # excluded from Git. The deselected checkpoint hashes the current README as
      # historical evidence, so the CI badge intentionally changes its checksum.
      - run: >-
          python -m pytest -q
          --ignore=tests/test_finalize_phase6_seed42.py
          --ignore=tests/test_phase6_seed42_final.py
          --deselect=tests/test_lifecycle_supersessions.py::test_current_phase4_checkpoint_is_explicitly_recorded
